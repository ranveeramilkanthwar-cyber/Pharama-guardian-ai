<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Access | Pharma Guardian AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        #space-canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .guardian-blue { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-access { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <canvas id="space-canvas"></canvas>

    <div class="glass w-full max-w-md p-10 rounded-[3rem] shadow-2xl m-4 relative animate-access border-blue-500/10 text-center">
        <div class="mb-8">
            <div class="guardian-blue w-16 h-16 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fas fa-key text-2xl text-white"></i>
            </div>
            <h2 class="text-3xl font-black tracking-tighter">NEURAL <span class="text-blue-500">LOGIN</span></h2>
            <p class="text-slate-500 text-[10px] uppercase font-bold tracking-[0.3em] mt-2">Identify Guardian Credentials</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div class="text-left space-y-1">
                <label class="text-[10px] uppercase font-bold text-slate-500 ml-2 italic">Neural ID (Email/Phone)</label>
                <input type="text" id="loginId" required placeholder="guardian@pharma.ai" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-sm focus:border-blue-500 outline-none transition">
            </div>
            <div class="text-left space-y-1">
                <label class="text-[10px] uppercase font-bold text-slate-500 ml-2 italic">Security Code (Password)</label>
                <input type="password" id="loginPass" required placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-sm focus:border-blue-500 outline-none transition">
            </div>
            
            <button type="submit" class="w-full guardian-blue py-5 rounded-2xl font-bold text-lg shadow-xl shadow-blue-600/20 hover:scale-[1.02] transition mt-4">
                Authorize Access
            </button>

            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-white/10"></div>
                <span class="px-4 text-[10px] text-slate-500 font-bold italic uppercase tracking-widest">or use</span>
                <div class="flex-grow border-t border-white/10"></div>
            </div>

            <button type="button" class="w-full border border-white/10 hover:bg-white/5 py-4 rounded-2xl font-bold transition text-xs uppercase tracking-widest">
                Request OTP Signal
            </button>
        </form>
        
        <div class="mt-8 flex justify-between items-center text-[10px] font-black uppercase tracking-widest">
            <button onclick="window.location.href='registration.html'" class="text-blue-400 hover:text-blue-300 transition">Create Profile</button>
            <button onclick="window.location.href='index.html'" class="text-slate-500 hover:text-white transition">Back Home</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

        // CONFIG - Integrated with your project
        const firebaseConfig = {
            apiKey: "AIzaSyAK33HQYLg3BqW25Arp7ERjuVn637mSOOo",
            authDomain: "pharma-guardian-ai.firebaseapp.com",
            projectId: "pharma-guardian-ai",
            storageBucket: "pharma-guardian-ai.firebasestorage.app",
            messagingSenderId: "569057807951",
            appId: "1:569057807951:web:2d0372e0f022f3428d643a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('loginId').value;
            const pass = document.getElementById('loginPass').value;

            try {
                // Authorize via Firebase Auth
                await signInWithEmailAndPassword(auth, id, pass);
                alert("Neural link established. Welcome back, Guardian.");
                window.location.href = 'index.html'; 
            } catch (err) {
                alert("Authorization Denied: " + err.message);
            }
        });
    </script>

    <script>
        // Space Canvas Animation logic remains identical for consistency
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = Array.from({length: 150}, () => ({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height, z: Math.random() * canvas.width
            }));
        }
        function draw() {
            ctx.fillStyle = "#020617"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                let x = (s.x - canvas.width / 2) * (canvas.width / s.z) + canvas.width / 2;
                let y = (s.y - canvas.height / 2) * (canvas.width / s.z) + canvas.height / 2;
                let size = (1 - s.z / canvas.width) * 1.5;
                ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI * 2); ctx.fill();
                s.z -= 1; if(s.z <= 0) s.z = canvas.width;
            });
            requestAnimationFrame(draw);
        }
        init(); draw();
    </script>
</body>
</html>
