<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Data Entry | Pharma Guardian AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        #space-canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .glass-vault { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .guardian-gradient { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); }
        input::placeholder { color: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <canvas id="space-canvas"></canvas>

    <div class="glass-vault w-full max-w-4xl p-10 rounded-[3.5rem] shadow-2xl m-4 relative border-blue-500/20">
        <div class="text-center mb-10">
            <h2 class="text-4xl font-black tracking-tighter uppercase">Initialize <span class="text-blue-500">Dashboard Data</span></h2>
            <p class="text-slate-500 text-[10px] uppercase font-bold tracking-[0.3em] mt-2 italic">Syncing Nanded Sector Statistics</p>
        </div>

        <form id="userDataForm" class="grid grid-cols-1 md:grid-cols-2 gap-8 text-left">
            
            <div class="space-y-4">
                <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest border-b border-blue-500/20 pb-2">Operational Stats</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-emerald-500/10 p-4 rounded-2xl border border-emerald-500/20">
                        <label class="text-[9px] font-bold text-emerald-400 uppercase">Total Orders</label>
                        <input type="number" id="totalOrders" placeholder="128" required class="w-full bg-transparent text-xl font-black outline-none">
                    </div>
                    <div class="bg-orange-500/10 p-4 rounded-2xl border border-orange-500/20">
                        <label class="text-[9px] font-bold text-orange-400 uppercase">Pending Refills</label>
                        <input type="number" id="pendingRefills" placeholder="14" required class="w-full bg-transparent text-xl font-black outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-red-500/10 p-4 rounded-2xl border border-red-500/20">
                        <label class="text-[9px] font-bold text-red-400 uppercase">Low Stock Items</label>
                        <input type="number" id="lowStock" placeholder="6" required class="w-full bg-transparent text-xl font-black outline-none">
                    </div>
                    <div class="bg-purple-500/10 p-4 rounded-2xl border border-purple-500/20">
                        <label class="text-[9px] font-bold text-purple-400 uppercase">Rejected Orders</label>
                        <input type="number" id="rejectedOrders" placeholder="9" required class="w-full bg-transparent text-xl font-black outline-none">
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest border-b border-blue-500/20 pb-2">Inventory Levels</h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center glass-vault p-3 rounded-xl">
                        <span class="text-xs font-bold">Metformin</span>
                        <select id="invMetformin" class="bg-transparent text-xs font-bold text-blue-400 outline-none">
                            <option value="In Stock: Plenty">In Stock: Plenty</option>
                            <option value="In Stock: Moderate">In Stock: Moderate</option>
                            <option value="Low Stock">Low Stock</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center glass-vault p-3 rounded-xl">
                        <span class="text-xs font-bold">Amlodipine</span>
                        <select id="invAmlodipine" class="bg-transparent text-xs font-bold text-red-400 outline-none">
                            <option value="Low Stock: Very Low">Low Stock: Very Low</option>
                            <option value="In Stock: Plenty">In Stock: Plenty</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center glass-vault p-3 rounded-xl">
                        <span class="text-xs font-bold">Insulin Pen</span>
                        <select id="invInsulin" class="bg-transparent text-xs font-bold text-blue-400 outline-none">
                            <option value="In Stock: Moderate">In Stock: Moderate</option>
                            <option value="In Stock: Plenty">In Stock: Plenty</option>
                            <option value="Out of Stock">Out of Stock</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="md:col-span-2">
                <button type="submit" class="w-full guardian-gradient py-6 rounded-3xl font-black text-lg shadow-2xl shadow-blue-600/30 hover:scale-[1.01] transition uppercase tracking-widest">
                    Synchronize Portal Data
                </button>
                <button type="button" onclick="window.location.href='profile.html'" class="w-full mt-4 text-[10px] text-slate-500 hover:text-white transition font-bold uppercase tracking-[0.2em]">
                    Skip to Profile
                </button>
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
        import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // CONFIG (Replace with your keys)
        const firebaseConfig = {
            apiKey: "AIzaSyAK33HQYLg3BqW25Arp7ERjuVn637mSOOo",
            authDomain: "pharma-guardian-ai.firebaseapp.com",
            projectId: "pharma-guardian-ai",
            appId: "1:569057807951:web:2d0372e0f022f3428d643a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('userDataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;

            if (user) {
                try {
                    await updateDoc(doc(db, "users", user.uid), {
                        totalOrders: document.getElementById('totalOrders').value,
                        pendingRefills: document.getElementById('pendingRefills').value,
                        lowStock: document.getElementById('lowStock').value,
                        rejectedOrders: document.getElementById('rejectedOrders').value,
                        inventory: {
                            metformin: document.getElementById('invMetformin').value,
                            amlodipine: document.getElementById('invAmlodipine').value,
                            insulin: document.getElementById('invInsulin').value
                        },
                        onboardingComplete: true
                    });
                    window.location.href = 'profile.html';
                } catch (err) { alert("Sync Error: " + err.message); }
            } else { alert("Please login first."); }
        });

        // Star Field Engine
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = Array.from({length: 150}, () => ({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, z: Math.random()*canvas.width }));
        }
        function draw() {
            ctx.fillStyle = "#020617"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                let x = (s.x - canvas.width/2) * (canvas.width/s.z) + canvas.width/2;
                let y = (s.y - canvas.height/2) * (canvas.width/s.z) + canvas.height/2;
                let size = (1 - s.z/canvas.width) * 2;
                ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fill();
                s.z -= 1.5; if(s.z <= 0) s.z = canvas.width;
            });
            requestAnimationFrame(draw);
        }
        init(); draw();
    </script>
</body>
</html>
