<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharma Guardian AI | Galactic Health Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; overflow-x: hidden; margin: 0; }
        #space-canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .guardian-blue { background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%); }
        
        .screen { position: absolute; width: 100%; height: 100vh; transition: all 1s cubic-bezier(0.85, 0, 0.15, 1); }
        .page-section { display: none; animation: slideFade 0.6s ease-out forwards; }
        .active-section { display: block; }
        
        @keyframes slideFade { 
            from { opacity: 0; transform: translateY(30px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <div id="landingScreen" class="screen overflow-y-auto">
        <nav class="flex justify-between items-center px-8 py-5 max-w-7xl mx-auto w-full glass rounded-[2rem] my-8 sticky top-4 z-[100]">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showSection('homeSection')">
                <div class="guardian-blue p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fas fa-shield-heart text-xl"></i>
                </div>
                <span class="text-2xl font-black tracking-tighter">Pharma<span class="text-blue-500 font-light">Guardian AI</span></span>
            </div>
            
            <div class="hidden lg:flex space-x-10 text-[11px] font-bold uppercase tracking-[0.2em] text-slate-400">
                <button onclick="showSection('homeSection')" class="hover:text-blue-400 transition">Base</button>
                <button onclick="showSection('featureSection')" class="hover:text-blue-400 transition">Features</button>
                <button onclick="showSection('aboutSection')" class="hover:text-blue-400 transition">About</button>
            </div>

            <div class="flex items-center space-x-4">
                <button onclick="window.location.href='login.html'" class="text-xs font-bold text-slate-300 hover:text-white transition">Sign In</button>
                <button onclick="window.location.href='registration.html'" class="guardian-blue text-white px-6 py-2.5 rounded-xl text-xs font-bold hover:scale-105 transition shadow-lg shadow-blue-500/30">Register</button>
            </div>
        </nav>

        <div id="homeSection" class="page-section active-section text-center max-w-5xl mx-auto pt-24 pb-32">
            <h1 class="text-6xl md:text-8xl font-black mb-8 tracking-tighter leading-[1.05]">
                Safeguarding the <br><span class="text-blue-400">Human Galaxy.</span>
            </h1>
            <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto mb-14 font-light">
                Elite pharmaceutical management powered by <b>Pharma Bee</b>.
            </p>
            <div class="flex justify-center gap-6">
                <button onclick="window.location.href='registration.html'" class="guardian-blue px-12 py-5 rounded-2xl font-bold shadow-2xl shadow-blue-500/30 hover:scale-105 transition">Initialize System</button>
            </div>
        </div>

        </div>

                y: Math.random() * canvas.height,
                z: Math.random() * canvas.width
            }));
        }
